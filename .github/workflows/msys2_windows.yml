name: CMake build and tests (Windows/MSYS2 UCRT64)

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - synchronize
      - opened
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 1'  # Monday 20:00 UTC

jobs:
  build_test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up MSYS2 UCRT64
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        # Cache the installed MSYS2 packages so the toolchain/dep install is
        # near-instant on subsequent runs.
        cache: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-gcc-fortran
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ccache
          mingw-w64-ucrt-x86_64-swig
          mingw-w64-ucrt-x86_64-python-numpy
          make
          bison
          m4
          patch
          elinks
    # Cache compiled objects (incl. the bundled HDF5/LibTIFF/PCRE2) across runs.
    # github.run_id makes each run write a fresh cache; restore-keys reuses the
    # most recent prior one. Harmless on a miss.
    - name: ccache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-windows-ucrt64-${{ github.run_id }}
        restore-keys: |
          ccache-windows-ucrt64-
    - name: Build
      shell: msys2 {0}
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Use Unix Makefiles, not Ninja: the SWIG Java bindings generate ~17
      # .java files that CMake's UseSWIG does not declare as build outputs
      # (they are a hardcoded list consumed by add_jar). Make tolerates these
      # undeclared outputs; Ninja errors with "missing and no known rule to
      # make it". This matches the generator the macOS build already uses.
      run: |
        # Bundled HDF5 1.14.6's _Float16 conversion code references FLT16_MAX,
        # which the MSYS2/UCRT64 mingw <float.h> only exposes in C23 mode. HDF5's
        # configure probe enables Float16 anyway, so the build fails to compile.
        # cbflib does not use HDF5's float16 path, so disable that feature.
        #
        # Pin the UCRT64 Python: find_package(Python) otherwise selects the
        # hosted MSVC Python that's on PATH, which cannot load the mingw-built
        # _pycbf.pyd (DLL load failed). cygpath -m converts the MSYS path to a
        # Windows path the native cmake understands.
        python_exe=$(cygpath -m "$(command -v python)")
        cmake -G "Unix Makefiles" -DHDF5_ENABLE_NONSTANDARD_FEATURE_FLOAT16=OFF \
          -DPython_EXECUTABLE="$python_exe" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache .
        cmake --build . --parallel
    - name: Test
      shell: msys2 {0}
      run: |
        ctest --parallel --output-on-failure
