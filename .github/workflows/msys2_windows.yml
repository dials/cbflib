name: CMake build and tests (Windows/MSYS2 UCRT64)

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - synchronize
      - opened
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 1'  # Monday 20:00 UTC

jobs:
  build_test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up MSYS2 UCRT64
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        cache: true
        install: >-
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-gcc-fortran
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ccache
          mingw-w64-ucrt-x86_64-swig
          mingw-w64-ucrt-x86_64-python-numpy
          make
          bison
          m4
          patch
          elinks
    # Cache compiled objects (incl. the bundled HDF5/LibTIFF/PCRE2) across runs.
    - name: ccache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-windows-ucrt64-${{ github.run_id }}
        restore-keys: |
          ccache-windows-ucrt64-
    - name: Build
      # Build notes:
      # - The CMake backend is Makefile instead of Ninja. This works around a
      #   problem with "undeclared build outputs" generated by the SWIG Java
      #   bindings.
      # - HDF5 looks for FLT16_MAX, which the MSYS2/UCRT64 mingw <float.h>
      #   does not expose except in C23 mode. We disable hdf5 float16 mode
      #   because cbflib does not use it anyway.
      shell: msys2 {0}
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      run: |
        python_exe=$(cygpath -m "$(command -v python)")
        cmake -G "Unix Makefiles" -DHDF5_ENABLE_NONSTANDARD_FEATURE_FLOAT16=OFF \
          -DPython_EXECUTABLE="$python_exe" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache .
        cmake --build . --parallel
    - name: Test
      shell: msys2 {0}
      run: |
        ctest --parallel --output-on-failure
