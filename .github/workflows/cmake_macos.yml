name: CMake build and tests (macOS)

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - synchronize
      - opened
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 1'  # Monday 20:00 UTC

jobs:
  build_test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install extra dependencies
      run: |
        brew install bison m4 gcc links swig
        # Use Homebrew bison instead of the bundled one
        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
        # Let CMake find Homebrew's gfortran, which has a version number
        echo "FC=$(ls "$(brew --prefix)"/bin/gfortran-* | sort -V | tail -n1)" >> "$GITHUB_ENV"
        python3 -m pip install --break-system-packages numpy
    - name: Build
      run: |
        cmake .
        cmake --build . --parallel $(sysctl -n hw.logicalcpu)
    - name: Test
      run: |
        ctest --parallel $(sysctl -n hw.logicalcpu) --output-on-failure
